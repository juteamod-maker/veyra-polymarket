[pytest]
markers =
    smoke: Critical path tests (run on every change)
    unit: Standard unit tests per module
    integration: Full integration / cross-module tests
    slow: Tests that take > 5 seconds
    e2e: End-to-end tests requiring real services (skip by default)

testpaths = tests
addopts =
    --ignore=tests/test_security_e2e.py
    --ignore=tests/test_ip_rate_limiter.py
