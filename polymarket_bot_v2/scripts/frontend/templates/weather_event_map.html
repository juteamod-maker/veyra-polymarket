{% extends "base.html" %}
{% block title %}V e Y r a - Weather Event Map{% endblock %}
{% block head %}
<script>/* T419: set data-requires-pm after DOM ready so document.body is not null */
  document.addEventListener('DOMContentLoaded', function () {
    if (document.body) document.body.setAttribute('data-requires-pm', '1');
  });
</script>
<link rel="stylesheet" href="/v2/static/css/vendor/leaflet.min.css" />
<script defer src="/v2/static/js/vendor/leaflet.min.js"></script>
<script defer src="/v2/static/js/vendor/chart.umd.min.js"></script>
<script defer src="/static/js/price_monitor.js?v={{ asset_version | default('0') }}"></script>
<script>
  if (typeof api === "undefined") {
    window.api = function (path, opts) {
      opts = opts || {};
      var sep = path.indexOf("?") >= 0 ? "&" : "?";
      var fetchOpts = { credentials: "include" };
      if (opts.method) fetchOpts.method = opts.method;
      if (opts.body) { fetchOpts.body = opts.body; fetchOpts.headers = { "Content-Type": "application/json" }; }
      if (opts.signal) fetchOpts.signal = opts.signal;
      return fetch(path + sep + "key=", fetchOpts).then(function (r) { return r.json(); });
    };
  }
</script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
    height: 100vh;
  }

  #top-header {
    height: 64px;
    background: rgba(13, 15, 22, 0.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #2a2d3a;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    min-width: 110px;
    user-select: none;
  }

  .nav-brand svg {
    flex-shrink: 0;
  }

  .nav-brand-text {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .nav-tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
    justify-content: center;
    min-width: 0;
    padding: 4px 6px;
    scrollbar-width: none;
  }

  .nav-tabs::-webkit-scrollbar {
    display: none;
  }

  .nav-tab {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    padding: 7px 10px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #9CA3AF;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 8px;
    border-bottom: 3px solid transparent;
    transition: all 200ms ease-in-out;
    user-select: none;
    gap: 6px;
    letter-spacing: 0.01em;
    text-decoration: none;
  }

  .nav-tab:hover {
    color: #D1D5DB;
    background: rgba(255, 255, 255, 0.05);
    transform: translateY(-1px) scale(1.03);
  }

  .nav-tab.active {
    color: #3B82F6;
    background: rgba(59, 130, 246, 0.09);
    border-bottom-color: #3B82F6;
    transform: none;
  }

  .nav-tab svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .nav-status-area {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-size: 0.7rem;
    color: #64748b;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600
  }

  .badge-green {
    background: #22c55e20;
    color: #22c55e
  }

  .badge-red {
    background: #ef444420;
    color: #ef4444
  }

  .badge-yellow {
    background: #eab30820;
    color: #eab308
  }

  .badge-gray {
    background: #64748b20;
    color: #94a3b8
  }

  #wm-refresh-paused {
    display: none;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 0.7rem;
    font-weight: 600;
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.1);
    white-space: nowrap;
    animation: wm-pulse 2s ease-in-out infinite
  }

  @keyframes wm-pulse {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: 0.5
    }
  }

  @media(max-width:1100px) {
    .nav-tab {
      padding: 6px 7px;
      font-size: 0.7rem;
      gap: 5px;
    }

    .nav-tab svg {
      width: 15px;
      height: 15px;
    }
  }

  @media(max-width:768px) {
    .nav-tab .nav-label {
      display: none;
    }

    .nav-tab {
      padding: 8px 9px;
      flex-shrink: 0;
    }

    .nav-tab svg {
      width: 17px;
      height: 17px;
    }

    .nav-tabs {
      justify-content: flex-start;
    }
  }

  #map-wrapper {
    flex: 1;
    position: relative;
  }

  #weather-map {
    width: 100%;
    height: 100%;
  }

  .leaflet-container {
    background: #0f1117;
  }

  .leaflet-tile {
    filter: brightness(0.7) saturate(1.2) contrast(1.1);
  }

  .leaflet-control-zoom a {
    background: #1a1d29 !important;
    color: #e2e8f0 !important;
    border-color: #2a2d3a !important;
  }

  .leaflet-control-zoom a:hover {
    background: #2a2d3a !important;
  }

  .wm-pin {
    width: 36px;
    height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s;
  }

  .wm-pin:hover {
    transform: scale(1.15);
  }

  .wm-pin .circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #0284c7;
    border: 3px solid #38bdf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #fff;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.5);
    position: relative;
  }

  .wm-pin .stem {
    width: 3px;
    height: 10px;
    background: #0284c7;
    border-radius: 2px;
    margin-top: -2px;
  }

  .wm-pin.has-bets .circle {
    background: #dc2626;
    border-color: #f87171;
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5);
  }

  .wm-pin .bet-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #eab308;
    color: #000;
    font-size: 9px;
    font-weight: 700;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #0f1117;
  }

    z-index: 2000;

    padding: 20px;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
  }

  }

    border: 1px solid #1e3a5f;

    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
  }

  .wm-overlay-header {

    flex-shrink: 0;
    border-bottom: 1px solid #1e3a5f;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(30, 58, 95, 0.28), rgba(15, 23, 42, 0.72));
  }

  .wm-overlay-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wm-top-tabs {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px;
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(59, 130, 246, 0.28);

  .wm-top-tab {
    border: 1px solid transparent;
    border-radius: 9px;
    background: transparent;
    color: #9fb4cf;
    font-size: 12px;
    font-weight: 700;

  }

  .wm-top-tab:hover {

    background: rgba(30, 58, 95, 0.55);
    border-color: rgba(96, 165, 250, 0.35);
  }

  .wm-top-tab.active {
    color: #eaf2ff;
    background: linear-gradient(180deg, rgba(59, 130, 246, 0.32), rgba(30, 64, 175, 0.28));
    border-color: rgba(96, 165, 250, 0.65);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
  }

  .wm-overlay-title {
    font-size: 20px;
    font-weight: 700;
    color: #f8fafc;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wm-overlay-subtitle {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
  }

  .wm-overlay-icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: transparent;
    color: #94a3b8;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .wm-overlay-icon-btn:hover {
    background: #1e293b;
    color: #e2e8f0;
    border-color: #475569;
  }

  .wm-overlay-refresh-btn {
    background: #16a34a;
    border-color: #22c55e;
    color: #ef4444;
    font-weight: 900;

  }

  .wm-overlay-refresh-btn:hover {
    background: #15803d;
    border-color: #4ade80;
    color: #fecaca;
  }

  .wm-sub-stats {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-top: 0;
  }

  .wm-pm-link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 10px 10px;
    border-radius: 10px;
    background: #0f172a;
    border: 1px solid #f59e0b40;

    text-decoration: none;
    transition: all 0.15s;
  }

  .wm-pm-link-btn .wm-pm-link-arrow {
    font-size: 10px;
    opacity: 0.6;
  }

  .wm-pm-link-btn:hover {
    background: #1a2030;
    border-color: #f59e0b;
    box-shadow: 0 0 0 1px #f59e0b20;
  }

  .wm-pm-link-btn.wm-pm-link-low {
    border-color: #3b82f640;
    color: #60a5fa;
  }

  .wm-pm-link-btn.wm-pm-link-low:hover {
    border-color: #3b82f6;

  }

  .wm-chart-card-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .wm-local-clock {
    font-size: 13px;
    font-weight: 700;
    color: #ef4444;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }

  .wm-tab-bar {
    display: none;
    gap: 0;
    padding: 0 24px;
    border-bottom: 1px solid #1e3a5f;
    flex-shrink: 0;
  }

  .wm-tab-btn {
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
    border: none;
    background: none;
    cursor: pointer;
    position: relative;
    transition: color 0.15s;
  }

  .wm-tab-btn:hover {
    color: #94a3b8;
  }

  .wm-tab-btn.active {
    color: #3b82f6;
  }

  .wm-tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: #3b82f6;
    border-radius: 1px;
  }

  .wm-overlay-body {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }

  .wm-tab-content {
    display: none;
    padding: 20px 24px;
  }

  .wm-tab-content.active {
    display: block;
  }

  .wm-intraday-grid {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    align-items: stretch;
  }

  @media(max-width: 960px) {
    .wm-intraday-grid {
      grid-template-columns: 1fr;
    }
  }

  .wm-left-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: 100%;
  }

  .wm-anchor-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .wm-anchor-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .wm-anchor-card-title {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .wm-anchor-city-badge {
    font-size: 11px;
    font-weight: 700;
    color: #e2e8f0;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 2px 8px;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .wm-anchor-hero {
    display: flex;
    align-items: stretch;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid #1e3a5f;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .wm-anchor-temp-col {
    flex-shrink: 0;
    display: flex;

    border-right: 1px solid #1e3a5f;

  }

  .wm-anchor-temp {
    font-size: 52px;
    font-weight: 800;
    color: #38bdf8;
    line-height: 1;
  }

  .wm-anchor-temp a {
    color: inherit;

  }

  .wm-anchor-temp a:hover {

  }

  .wm-anchor-source-label {
    font-size: 10px;
    font-weight: 600;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.06em;

  }

  .wm-anchor-info-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    padding: 16px 18px;
  }

  .wm-anchor-cond-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wm-anchor-weather-icon {
    font-size: 24px;
  }

  .wm-anchor-weather-text {
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;
  }

  .wm-anchor-time-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .wm-anchor-time-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
    animation: wmBlink 1.8s ease-in-out infinite;
  }

  @keyframes wmBlink {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.25;
    }
  }

  .wm-anchor-time-label {
    font-size: 10px;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .wm-anchor-time {
    font-size: 12px;
    font-weight: 700;
    color: #fca5a5;
  }

  .wm-forecast-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .wm-forecast-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 9999px;
    border: 1px solid transparent;
  }

  .wm-forecast-pill.high {
    background: rgba(249, 115, 22, 0.12);
    border-color: rgba(249, 115, 22, 0.35);
    color: #fb923c;
  }

  .wm-forecast-pill.low {
    background: rgba(59, 130, 246, 0.12);
    border-color: rgba(59, 130, 246, 0.35);
    color: #60a5fa;
  }

  .wm-forecast-pill.dev-up {
    background: rgba(245, 158, 11, 0.12);
    border-color: rgba(245, 158, 11, 0.35);
    color: #fbbf24;
  }

  .wm-forecast-pill.dev-down {
    background: rgba(59, 130, 246, 0.12);
    border-color: rgba(59, 130, 246, 0.35);
    color: #93c5fd;
  }

  .wm-forecast-pill.dev-ok {
    background: rgba(34, 197, 94, 0.12);
    border-color: rgba(34, 197, 94, 0.35);
    color: #4ade80;
  }

  .wm-forecast-pill.model {
    background: rgba(100, 116, 139, 0.12);
    border-color: rgba(100, 116, 139, 0.3);
    color: #94a3b8;
  }

  .wm-referral-section {
    margin-top: 0;
  }

  .wm-referral-header {
    margin-bottom: 8px;
  }

  .wm-referral-title {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .wm-referral-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .wm-mini-signals {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid #1e3a5f;
    padding-top: 12px;
  }

  .wm-mini-signal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: 8px;
    gap: 8px;
  }

  .wm-mini-signal-row:hover {
    background: rgba(255, 255, 255, 0.03);
  }

  .wm-mini-signal-left {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .wm-mini-signal-icon {
    font-size: 14px;
    flex-shrink: 0;
  }

  .wm-mini-signal-title {
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    white-space: nowrap;
  }

  .wm-mini-signal-badge {
    font-size: 10px;
    font-weight: 700;

    border-radius: 9999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .wm-mini-signal-badge.up {
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
  }

  .wm-mini-signal-badge.down {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
  }

  .wm-mini-signal-badge.neutral {
    background: rgba(100, 116, 139, 0.15);
    color: #94a3b8;
  }

  .wm-mini-signal-badge.warn {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
  }

  .wm-peak-section {
    margin-top: 16px;
  }

  .wm-peak-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .wm-peak-label {
    font-size: 12px;
    color: #94a3b8;
  }

  .wm-peak-status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .wm-peak-status-badge.active {
    background: #22c55e20;
    color: #22c55e;
  }

  .wm-peak-status-badge.done {
    background: #64748b20;
    color: #94a3b8;
  }

  .wm-peak-status-badge.waiting {
    background: #eab30820;
    color: #eab308;
  }

    background: linear-gradient(90deg, #22c55e, #4ade80);

  .wm-peak-fill.done {
    background: #64748b;

    display: flex;
    justify-content: space-between;

    color: #475569;
    margin-top: 4px;

  .wm-sub-stats {
    display: block;

<script>
  /* T483: 延后初始化到 DOMContentLoaded，配合 leaflet/chart 脚本的 defer（defer 脚本保证在 DCL 之前按顺序执行完毕），
     首屏不被渲染阅本阻塞。 */
  document.addEventListener('DOMContentLoaded', function () {
    'use strict';
    function t(k, fb) {
      try { return (window.veyraI18n && window.veyraI18n.t) ? window.veyraI18n.t(k, fb) : fb; }
      catch (_e) { return fb; }
    }

    var southWest = L.latLng(-85, -Infinity);
    var northEast = L.latLng(85, Infinity);
    var mapBounds = L.latLngBounds(southWest, northEast);

    var map = L.map('weather-map', {
      center: [20, 0],
      zoom: 3,
      minZoom: 3,
      maxZoom: 5,
      zoomControl: true,
      attributionControl: false,
      worldCopyJump: true,
      maxBounds: mapBounds,
      maxBoundsViscosity: 1.0,
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19,
      noWrap: false,
    }).addTo(map);

    // 刷新地图尺寸（关键：容器高度确认）
    setTimeout(function () {
      map.invalidateSize();
    }, 100);
    window.addEventListener('resize', function () {
      map.invalidateSize();
    });

    var markers = {};
    var currentCityData = null;
    var cityDetailAbortCtrl = null;
    var cityDetailReqSeq = 0;

    function loadCities() {
      fetch('/api/weather-map/cities')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.status !== 'ok') return;
          document.getElementById('stat-cities').textContent = data.count;
          var totalBets = 0;

          data.cities.forEach(function (city) {
            if (!city.lat || !city.lon) return;
            totalBets += city.active_bets || 0;

            var hasBets = (city.active_bets || 0) > 0;
            var pinClass = hasBets ? 'wm-pin has-bets' : 'wm-pin';
            var betBadge = hasBets ? '<div class="bet-badge">' + city.active_bets + '</div>' : '';

            var icon = L.divIcon({
              className: '',
              html: '<div class="' + pinClass + '"><div class="circle">⛅' + betBadge + '</div><div class="stem"></div></div>',
              iconSize: [36, 44],
              iconAnchor: [18, 44],
            });

            var marker = L.marker([city.lat, city.lon], { icon: icon }).addTo(map);
            marker.on('click', (function (name) {
              return function () { openOverlay(name); };
            })(city.name));

            markers[city.name.toLowerCase()] = marker;
          });

          document.getElementById('stat-bets').textContent = totalBets;
        })
        .catch(function (e) {
          console.error('[WeatherMap] Failed to load cities:', e);
        });
    }

    var overlayHistoryLoaded = {};
    var currentOverlayTab = 'intraday';

    window.openOverlay = function (cityName) {
      var overlay = document.getElementById('city-overlay');
      overlay.classList.add('open');

      switchOverlayTab('intraday');
      overlayHistoryLoaded[cityName] = false;

      document.getElementById('intraday-loading').style.display = 'none';
      document.getElementById('intraday-content').style.display = '';
      document.getElementById('intraday-content').innerHTML = buildIntradaySkeleton(cityName);
      document.getElementById('history-loading').style.display = '';
      document.getElementById('history-content').style.display = 'none';
      document.getElementById('history-content').innerHTML = '';

      currentCityData = { name: cityName };
      cityDetailReqSeq += 1;
      loadCityDetail(cityName, cityDetailReqSeq);
    };

    window.closeOverlay = function () {
      if (cityDetailAbortCtrl) {
        cityDetailAbortCtrl.abort();
        cityDetailAbortCtrl = null;
      }
      document.getElementById('city-overlay').classList.remove('open');
      currentCityData = null;
      if (typeof WmBetsModule !== 'undefined') WmBetsModule.cleanup();
      if (_clockTimer) { clearInterval(_clockTimer); _clockTimer = null; }
    };

    (function () {
      var _ov = document.getElementById('city-overlay');
      if (_ov && _ov.parentElement !== document.body) document.body.appendChild(_ov);
    })();

    document.getElementById('city-overlay').addEventListener('click', function (e) {
      if (e.target === this) closeOverlay();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeOverlay();
    });

    window.switchOverlayTab = function (tab) {
      currentOverlayTab = tab;
      document.querySelectorAll('.wm-top-tab').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
      document.querySelectorAll('.wm-tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
      document.querySelectorAll('.wm-tab-content').forEach(function (c) { c.classList.toggle('active', c.id === 'tab-' + tab); });

      var cityName = currentCityData ? currentCityData.name : '--';
      if (tab === 'history') {
        if (currentCityData && !overlayHistoryLoaded[cityName]) {
          loadCityHistory(cityName);
        }
      } else if (tab === 'bets') {
        if (currentCityData && currentCityData.name) {
          WmBetsModule.loadCityBets(currentCityData.name);
        }
      }
    };

    function loadCityDetail(cityName, reqSeq) {
      if (cityDetailAbortCtrl) {
        cityDetailAbortCtrl.abort();
      }
      cityDetailAbortCtrl = new AbortController();
      fetch('/api/weather-map/city-detail/' + encodeURIComponent(cityName), { signal: cityDetailAbortCtrl.signal })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (reqSeq !== cityDetailReqSeq) return;
          document.getElementById('intraday-loading').style.display = 'none';
          if (d.status !== 'ok') {
            document.getElementById('intraday-content').style.display = '';
            document.getElementById('intraday-content').innerHTML = '<div style="color:#ef4444">⚠️ ' + esc(d.reason || t('weatherMap.err.dataUnavailable', 'Data unavailable')) + '</div>';
            return;
          }
          currentCityData = Object.assign(currentCityData || {}, d);
          document.getElementById('intraday-content').style.display = '';
          document.getElementById('intraday-content').innerHTML = buildIntradayContent(d);
          setTimeout(function () { renderTempChart(d); }, 100);
          setTimeout(function () { _startLocalClock(); }, 150);
        })
        .catch(function (e) {
          if (e && e.name === 'AbortError') return;
          if (reqSeq !== cityDetailReqSeq) return;
          console.error('[WeatherMap] City detail error:', e);
          document.getElementById('intraday-loading').style.display = 'none';
          document.getElementById('intraday-content').style.display = '';
          document.getElementById('intraday-content').innerHTML = t("weatherMap.lit.8be63e3086", "<div style=\"color:#ef4444\">⚠️ Network error</div>");
        });
    }

    function buildIntradaySkeleton(cityName) {
      return '' +
        '<div class="wm-sk-shell">' +
        '<div class="wm-sk-row">' +
        '<div class="wm-sk-card">' +
        '<span class="wm-sk-line lg"></span>' +
        '<span class="wm-sk-line md"></span>' +
        '<span class="wm-sk-line sm"></span>' +
        '</div>' +
        '<div class="wm-sk-card">' +
        '<span class="wm-sk-line full"></span>' +
        '<span class="wm-sk-line w70"></span>' +
        '<span class="wm-sk-line w50"></span>' +
        '</div>' +
        '</div>' +
        '<div class="wm-sk-card">' +
        '<span class="wm-sk-line w60"></span>' +
        '<span class="wm-sk-line full"></span>' +
        '<span class="wm-sk-line full"></span>' +
        '<span class="wm-sk-line w70"></span>' +
        '</div>' +
        '<div style="font-size:12px;color:#94a3b8;padding:0 2px">' + esc(cityName || '') + ' · ' + t('weatherMap.loading.intraday', 'AI is analyzing weather data...') + '</div>' +
        '</div>';
    }

    function buildIntradayContent(d) {
      var isUS = _isUSCity(d.timezone, d.city);
      var tempC = d.current_temp_c != null ? Math.round(d.current_temp_c) : null;
      var tempF = d.current_temp_f != null ? Math.round(d.current_temp_f) : null;
      var primaryTemp = isUS ? (tempF != null ? tempF + '°F' : '--') : (tempC != null ? tempC + '°C' : '--');

    function esc(s) {
      if (s == null) return '';
      var d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function _isUSCity(tz, city) {
      if (!tz) return false;
      var usParts = ['New_York', 'Chicago', 'Denver', 'Los_Angeles', 'Phoenix', 'Anchorage', 'Adak', 'Detroit', 'Indiana', 'Kentucky', 'Boise', 'Juneau', 'Nome'];
      var isUS = tz.startsWith('America/') && usParts.some(function (p) { return tz.indexOf(p) >= 0; });
      if (tz === 'Pacific/Honolulu') isUS = true;
      var nonUS = ['Buenos Aires', 'Mexico City', 'Panama City', 'São Paulo', 'Toronto', 'Bogota', 'Lima', 'Santiago', 'Havana'];
      if (nonUS.some(function (c) { return (city || '').indexOf(c) >= 0; })) isUS = false;
      return isUS;
    }
    function _c2f(c) { return c != null ? Math.round(c * 9 / 5 + 32) : null; }
    function _tempStr(c, isUS) {
      if (c == null) return '--';
      return isUS ? Math.round(c * 9 / 5 + 32) + '°F' : Math.round(c) + '°C';
    }
    function _tempVal(c, isUS) {
      if (c == null) return null;
      return isUS ? Math.round(c * 9 / 5 + 32) : Math.round(c);
    }
    function _slugifyCityName(name) {
      var base = String(name || '');
      try {
        base = base.normalize('NFD').replace(/[̀-ͯ]/g, '');
      } catch (e) {

      }
      return base.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    function formatMetar(text) {
      if (!text) return '';
      return esc(text)
        .replace(/(\u6c14\u6e29\s*[\d.-]+°[CF]\s*\([\d.-]+°[CF]\))/g, '<span class="metar-temp">$1</span>')
        .replace(/([\u5317\u4e1c\u5357\u897f]+\u98ce\s*\d+kt[^|]*)/g, '<span class="metar-wind">$1</span>');
    }

    function _toStructuredTafItems(tafText) {
      var text = (tafText || '').trim();
      if (!text) return [];

      var raw = text;
      if (raw.indexOf(t('weatherMap.auto.24e99efd', 'TAF\u539f\u6587(\u964d\u7ea7\u6e90NWS)：')) === 0) {
        raw = raw.replace(t('weatherMap.auto.24e99efd', 'TAF\u539f\u6587(\u964d\u7ea7\u6e90NWS)：'), '').trim();
      }

      var out = [];
      function push(label, value) {
        if (!value) return;
        out.push({ label: label, value: value });
      }

      var windMatch = raw.match(/\b(\d{3}|VRB)(\d{2,3})(G\d{2,3})?KT\b/);
      if (windMatch) {
        var d = windMatch[1] === 'VRB' ? t('weatherMap.taf.windVRB', 'Variable wind') : (windMatch[1] + '°');
        var g = windMatch[3] ? (t('weatherMap.taf.gustsLabel', ', gusts ') + windMatch[3].slice(1) + t('weatherMap.taf.windKt', 'kt')) : '';
        push(t('weatherMap.taf.windField', 'Wind'), d + t('weatherMap.taf.windSpeed', ', speed ') + windMatch[2] + t('weatherMap.taf.windKt', 'kt') + g);
      } else if (raw.indexOf(t('weatherMap.taf.windWord', 'wind')) >= 0) {
        var cnWind = raw.match(/[^，。；;]*\u98ce[^，。；;]*/);
        if (cnWind) push(t('weatherMap.taf.windField', 'Wind'), cnWind[0].trim());
      }

      var visMatch = raw.match(/\b(\d+(?:\.\d+)?)SM\b/i);
      if (visMatch) {
        var sm = parseFloat(visMatch[1]);
        var visTxt = sm >= 6 ? t('weatherMap.taf.visGood', 'Visibility good (>=6SM)') : (t('weatherMap.taf.visAbout', 'Visibility about ') + sm + 'SM');
        push(t('weatherMap.taf.visLabel', 'Visibility'), visTxt);
      } else if (raw.indexOf(t('weatherMap.taf.visLabel', 'Visibility')) >= 0) {
        var cnVis = raw.match(/[^，。；;]*\u80fd\u89c1\u5ea6[^，。；;]*/);
        if (cnVis) push(t('weatherMap.taf.visLabel', 'Visibility'), cnVis[0].trim());
      }

      var cloud = '';
      if (/OVC|BKN|\u9634|\u5bc6\u4e91/i.test(raw)) cloud = t('weatherMap.taf.cloudHigh', 'Mid-to-high cloud cover, temperature suppression risk');
      else if (/SCT|FEW|\u6674|\u5c11\u4e91/i.test(raw)) cloud = t('weatherMap.taf.cloudLow', 'Low cloud cover, surface heating conditions favorable');
      if (cloud) push(t('weatherMap.taf.cloudStruct', 'Cloud Structure'), cloud);

      var wx = '';
      if (/TS|\u96f7\u66b4/i.test(raw)) wx = t('weatherMap.taf.thunder', 'Thunderstorm signal, short-term strong convection may suppress temperature');

      window.loadDetailPriceChart = function (betId, hours) {
        var b = null;
        for (var i = 0; i < _bets.length; i++) {
          if (_bets[i].bet_id === betId) { b = _bets[i]; break; }
        }
        if (!b) return;
        var isPmLike = _isSnapshotBet(b) || _isManualPmBet(b);

        var interval = '6h';
        if (hours <= 1) interval = '1h';
        else if (hours <= 6) interval = '6h';
        else if (hours <= 24) interval = '1d';
        else interval = '1w';

        var loadingEl = document.getElementById('dp-pchart-loading-' + betId);
        var curEl = document.getElementById('dp-pchart-cur-' + betId);
        var chgEl = document.getElementById('dp-pchart-chg-' + betId);
        if (loadingEl) {
          loadingEl.style.display = '';
          loadingEl.innerHTML = '<span class="spinner"></span> ' + t('weatherMap.detail.loadingPrice', 'Loading price data...');
        }

        var btns = document.querySelectorAll('.dp-pchart-range[data-bet="' + betId + '"]');
        btns.forEach(function (btn) {
          btn.classList.toggle('active', String(btn.getAttribute('data-hours')) === String(hours));
        });

        var historyUrl = '';
        if (isPmLike) {
          var cid = _extractConditionId(b);
          if (!cid) {
            if (loadingEl) loadingEl.innerHTML = '<span style="color:#94a3b8">' + t('weatherMap.detail.noPriceData', 'No price data available yet') + '</span>';
            return;
          }
          historyUrl = '/api/pm/market/trades?market=' + encodeURIComponent(cid) + '&limit=120';
        } else {
          historyUrl = '/api/bets/' + encodeURIComponent(betId) + '/price-history?interval=' + encodeURIComponent(interval);
        }

        fetch(historyUrl)
          .then(function (r) { return r.json(); })
          .then(function (res) {
            var hist = [];
            if (isPmLike) {
              var trades = (res && res.trades) || [];
              var out = String((b.outcome || '')).toUpperCase();
              hist = trades
                .filter(function (tk) {
                  if (!out) return true;
                  var to = String((tk && tk.outcome) || '').toUpperCase();
                  return !to || to === out;
                })
                .map(function (tk) { return { t: Number((tk && tk.timestamp) || 0), p: Number((tk && tk.price) || NaN) }; })
                .filter(function (pt) { return isFinite(pt.t) && isFinite(pt.p); })
                .sort(function (a, bx) { return a.t - bx.t; });
            } else {
              hist = (res && res.history) || [];
            }
            if (!Array.isArray(hist) || hist.length === 0) {
              if (loadingEl) loadingEl.innerHTML = '<span style="color:#94a3b8">' + t('weatherMap.detail.noPriceData', 'No price data available yet') + '</span>';
              return;
            }

            var labels = [];
            var values = [];
            for (var k = 0; k < hist.length; k++) {
              var pt = hist[k] || {};
              var ts = Number(pt.t || 0) * 1000;
              var price = Number(pt.p);
              if (!isFinite(ts) || !isFinite(price)) continue;
              labels.push(new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }));
              values.push(price * 100);
            }
            if (!values.length) {
              if (loadingEl) loadingEl.innerHTML = '<span style="color:#94a3b8">' + t('weatherMap.detail.noPriceData', 'No price data available yet') + '</span>';
              return;
            }

            var canvas = document.getElementById('dp-pchart-' + betId);
            if (!canvas || !window.Chart) return;
            if (_detailCharts[betId]) {
              _detailCharts[betId].destroy();
              _detailCharts[betId] = null;
            }

            var ctx = canvas.getContext('2d');
            _detailCharts[betId] = new Chart(ctx, {
              type: 'line',
              data: {
                labels: labels,
                datasets: [{
                  data: values,
                  borderColor: '#60a5fa',
                  backgroundColor: 'rgba(96,165,250,0.14)',
                  borderWidth: 2,
                  tension: 0.28,
                  fill: true,
                  pointRadius: 0,
                  pointHoverRadius: 3
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  x: { grid: { color: 'rgba(148,163,184,0.12)' }, ticks: { color: '#94a3b8', maxTicksLimit: 6 } },
                  y: {
                    grid: { color: 'rgba(148,163,184,0.12)' },
                    ticks: {
                      color: '#94a3b8',
                      callback: function (v) { return Number(v).toFixed(1) + '¢'; }
                    }
                  }
                }
              }
            });

            var first = values[0];
            var last = values[values.length - 1];
            if (curEl) curEl.textContent = last.toFixed(1) + '¢';
            if (chgEl && isFinite(first) && first !== 0) {
              var deltaPct = (last - first) / first;
              var up = deltaPct >= 0;
              chgEl.innerHTML = '<b style="color:' + (up ? '#34d399' : '#fb7185') + '">' + (up ? '+' : '') + (deltaPct * 100).toFixed(2) + '%</b>';
            }
            if (loadingEl) loadingEl.style.display = 'none';
          })
          .catch(function () {
            if (loadingEl) loadingEl.innerHTML = '<span style="color:#ef4444">' + t('weatherMap.detail.priceLoadFailed', 'Price load failed') + '</span>';
          });
      };

      function _startLive() {
        if (_liveTimer) return;
        _pollLive();
        _liveTimer = setInterval(_pollLive, 5000);
      }
      function _stopLive() {
        if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
      }
      function _pollLive() {
        var tab = document.getElementById('tab-bets');
        if (!tab || !tab.classList.contains('active')) { _stopLive(); return; }
        var openBets = _bets.filter(function (b) { return !b.resolved_outcome; });
        if (!openBets.length) return;
        fetch('/api/bets/live-prices')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var prices = d.prices || {};
            for (var betId in prices) {
              var p = prices[betId];
              if (p.cp == null) continue;
              for (var i = 0; i < _bets.length; i++) {
                if (_bets[i].bet_id === betId) {
                  _bets[i].current_price = p.cp;
                  _bets[i].unrealized_pnl = p.upnl;
                  _bets[i].unrealized_pnl_pct = p.upnl_pct;

                  var cpEl = document.getElementById('wm-cp-' + betId);
                  var pnlEl = document.getElementById('wm-pnl-' + betId);
                  if (cpEl) {
                    var entry = _bets[i].entry_price || _bets[i].actual_avg_price || _bets[i].market_price || 0;
                    var df = p.cp - entry;
                    var clr = df > 0.001 ? '#34d399' : (df < -0.001 ? '#fb7185' : '#94a3b8');
                    cpEl.innerHTML = '<span style="color:' + clr + '">' + _fmtCents(p.cp) + '</span>';
                    cpEl.classList.add('bc-price-flash');
                    setTimeout(function (el) { el.classList.remove('bc-price-flash'); }, 500, cpEl);
                  }
                  if (pnlEl && p.upnl != null) {
                    var pc = p.upnl >= 0 ? '#34d399' : '#fb7185';
                    pnlEl.innerHTML = '<span style="color:' + pc + '">' + _fmtPnl(p.upnl) + '</span>' +
                      (p.upnl_pct != null ? ' <span class="bc-r-pnl-pct" style="color:' + pc + '">' + _fmtPct(p.upnl_pct) + '</span>' : '');
                  }
                  var detailCurEl = document.getElementById('dp-pchart-cur-' + betId);
                  var detailChgEl = document.getElementById('dp-pchart-chg-' + betId);
                  if (detailCurEl) detailCurEl.textContent = _fmtCents(p.cp);
                  if (detailChgEl) {
                    var entry2 = _bets[i].entry_price || _bets[i].actual_avg_price || _bets[i].market_price || 0;
                    if (entry2 > 0) {
                      var dPct = (p.cp - entry2) / entry2;
                      var up2 = dPct >= 0;
                      detailChgEl.innerHTML = '<b style="color:' + (up2 ? '#34d399' : '#fb7185') + '">' + (up2 ? '+' : '') + (dPct * 100).toFixed(2) + '%</b>';
                    }
                  }
                  break;
                }
              }
            }
          }).catch(function () { });

        var hasSnapshot = _bets.some(function (b) { return _isSnapshotBet(b); });
        if (hasSnapshot && currentCityData && currentCityData.name) {
          fetch('/api/weather-map/city-bets/' + encodeURIComponent(currentCityData.name))
            .then(function (r) { return r.json(); })
            .then(function (res) {
              var rows = (res && res.bets) || [];
              for (var j = 0; j < rows.length; j++) {
                var it = rows[j] || {};
                if (!_isSnapshotBet(it)) continue;
                for (var i2 = 0; i2 < _bets.length; i2++) {
                  var b2 = _bets[i2];
                  if (!_isSnapshotBet(b2)) continue;
                  if (String(b2.bet_id) !== String(it.bet_id)) continue;
                  b2.current_price = it.current_price;
                  b2.unrealized_pnl = it.unrealized_pnl;
                  b2.unrealized_pnl_pct = it.unrealized_pnl_pct;

                  var cpEl2 = document.getElementById('wm-cp-' + b2.bet_id);
                  var pnlEl2 = document.getElementById('wm-pnl-' + b2.bet_id);
                  if (cpEl2 && it.current_price != null) cpEl2.innerHTML = '<span style="color:#e2e8f0">' + _fmtCents(it.current_price) + '</span>';
                  if (pnlEl2 && it.unrealized_pnl != null) {
                    var pc2 = it.unrealized_pnl >= 0 ? '#34d399' : '#fb7185';
                    pnlEl2.innerHTML = '<span style="color:' + pc2 + '">' + _fmtPnl(it.unrealized_pnl) + '</span>' +
                      (it.unrealized_pnl_pct != null ? ' <span class="bc-r-pnl-pct" style="color:' + pc2 + '">' + _fmtPct(it.unrealized_pnl_pct) + '</span>' : '');
                  }

                  var dCur2 = document.getElementById('dp-pchart-cur-' + b2.bet_id);
                  var dChg2 = document.getElementById('dp-pchart-chg-' + b2.bet_id);
                  if (dCur2 && it.current_price != null) dCur2.textContent = _fmtCents(it.current_price);
                  if (dChg2 && it.current_price != null) {
                    var epx2 = b2.entry_price || b2.actual_avg_price || b2.market_price || 0;
                    if (epx2 > 0) {
                      var pct2 = (it.current_price - epx2) / epx2;
                      var upx2 = pct2 >= 0;
                      dChg2.innerHTML = '<b style="color:' + (upx2 ? '#34d399' : '#fb7185') + '">' + (upx2 ? '+' : '') + (pct2 * 100).toFixed(2) + '%</b>';
                    }
                  }
                }
              }
            })
            .catch(function () { });
        }
      }

      function loadCityBets(cityName, options) {
        var forceReload = !!(options && options.force);
        if (!forceReload && _loadedCity === cityName && _bets.length > 0) {

          document.getElementById('bets-loading').style.display = 'none';
          document.getElementById('bets-content').style.display = '';
          _startLive();
          return;
        }
        _loadedCity = cityName;
        _bets = [];
        _openDetailId = null;
        _detailCache = {};
        _stopLive();
        document.getElementById('bets-loading').style.display = '';
        document.getElementById('bets-content').style.display = 'none';

        function _applyBets(openBets) {
          _bets = openBets || [];
          document.getElementById('bets-loading').style.display = 'none';
          document.getElementById('bets-content').style.display = '';
          if (_bets.length === 0) {
            document.getElementById('bets-content').innerHTML =
              '<div class="bc-empty"><div class="bc-empty-icon">📊</div>' +
              t("weatherMap.lit.b35a99d975", "<div class=\"bc-empty-title\">No current positions in this city</div>") +
              t("weatherMap.lit.8e16f9fd9c", "<div class=\"bc-empty-desc\">Waiting for system to discover new weather betting opportunities</div></div>");
          } else {
            _renderAll();
            _startLive();
          }
        }

        function _loadFromHistoryFallback() {

          return fetch('/api/bets/history?category=weather&status=open&per_page=200&page=1')
            .then(function (r) { return r.json(); })
            .then(function (result) {
              var allOpen = (result && result.bets) || [];
              return allOpen.filter(function (b) { return _cityMatchesBet(cityName, b); });
            });
        }

        function _betDedupKey(b) {
          var out = String((b && b.outcome) || '').toUpperCase();
          var cid = _extractConditionId(b);
          if (cid) return cid + ':' + out;
          return [String((b && b.event_slug) || ''), String((b && b.market_slug) || ''), out].join('|').toLowerCase();
        }

        function _loadManualPmOpenByCity() {
          return fetch('/api/user/pm/bets?status=open&per_page=200&page=1&refresh=0')
            .then(function (r) { if (!r.ok) return { bets: [] }; return r.json(); })
            .then(function (res) {
              var all = (res && res.bets) || [];
              return all.filter(function (b) { return _cityMatchesBet(cityName, b); });
            })
            .catch(function () { return []; });
        }

        fetch('/api/weather-map/city-bets/' + encodeURIComponent(cityName))
          .then(function (r) { if (!r.ok) throw new Error('city-bets http ' + r.status); return r.json(); })
          .then(function (result) {
            var openBets = (result && result.bets) || [];
            return _loadManualPmOpenByCity().then(function (manualPm) {
              var merged = openBets.concat(manualPm || []);
              var deduped = [];
              var seen = {};
              for (var i3 = 0; i3 < merged.length; i3++) {
                var row = merged[i3];
                var key = _betDedupKey(row);
                if (!key) continue;
                if (seen[key] == null) {
                  seen[key] = deduped.length;
                  deduped.push(row);
                  continue;
                }
                var prev = deduped[seen[key]];
                if (_isSnapshotBet(prev) && !_isSnapshotBet(row)) deduped[seen[key]] = row;
              }
              if (deduped.length > 0) {
                _applyBets(deduped);
                return;
              }
              return _loadFromHistoryFallback().then(_applyBets);
            });
          }).catch(function (e) {
            console.error('[WmBets] city-bets load error, fallback to history:', e);
            Promise.all([_loadFromHistoryFallback(), _loadManualPmOpenByCity()])
              .then(function (parts) {
                _applyBets((parts[0] || []).concat(parts[1] || []));
              })
              .catch(function (err) {
                console.error('[WmBets] fallback load error:', err);
                document.getElementById('bets-loading').innerHTML =
                  t("weatherMap.lit.95098db57f", "<div style=\"color:#ef4444\">\u26a0\ufe0f Failed to load bet data</div>");
              });
          });
      }

      function cleanup() {
        _stopLive();
        Object.keys(_detailCharts).forEach(function (k) { if (_detailCharts[k]) { _detailCharts[k].destroy(); } });
        _detailCharts = {};
        _loadedCity = null;
        _bets = [];
        _openDetailId = null;
        _detailCache = {};
      }

      return {
        loadCityBets: loadCityBets,
        toggleDetail: _toggleDetail,
        cleanup: cleanup
      };
    })();

    window.WmBetsModule = WmBetsModule;

    loadCities();

  });
</script>
<script>
  if (window.veyraI18n && typeof window.veyraI18n.registerPagePack === 'function') {
    window.veyraI18n.registerPagePack('weather_event_map');
  }
</script>
