{% extends "base.html" %}

{% block title %}{{ event_slug or i18n_dict.get('event.title.fallback','Event Detail') }}{% endblock %}
{% block breadcrumb %}{{ i18n_dict.get('event.breadcrumb','Discover / Event Detail') }}{% endblock %}

{% block content %}
<script>
  document.body.setAttribute('data-requires-pm', '1');
  window.__EVENT_SLUG__ = {{ event_slug | tojson | safe }};
</script>

<style>
  .ev-hero {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    gap: 18px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .ev-hero-img {
    width: 88px;
    height: 88px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--bg-primary);
    border: 1px solid var(--border);
  }

  .ev-hero-meta {
    flex: 1;
    min-width: 260px;
  }

  .ev-hero-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .ev-hero-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 8px;
    font-size: .78rem;
    color: var(--text-muted);
  }

  .ev-cat-badge {
    background: rgba(139, 92, 246, .15);
    color: #a78bfa;
    padding: 3px 10px;
    border-radius: 6px;
    font-weight: 600;
    letter-spacing: .4px;
    font-size: .7rem;
  }

  .ev-stat-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .ev-stat-item {
    font-size: .82rem;
    color: var(--text-secondary);
  }

  .ev-stat-item b {
    color: var(--text-primary);
    font-size: .95rem;
    margin-left: 4px;
  }

  .ev-stat-vol b {
    color: #a78bfa;
  }

  .ev-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 16px;
    margin-top: 16px;
    align-items: start;
  }

  @media (max-width: 960px) {
    .ev-grid {
      grid-template-columns: 1fr;
    }
  }

  .ev-right-sticky {
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    overflow-x: hidden;
  }

  .ev-right-sticky::-webkit-scrollbar {
    width: 6px;
  }

  .ev-right-sticky::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .ev-right-sticky::-webkit-scrollbar-track {
    background: transparent;
  }

  @media (max-width: 960px) {
    .ev-right-sticky {
      position: static;
      max-height: none;
      overflow: visible;
    }
  }

  .ev-section-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .ev-section-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ev-section-body {
    padding: 14px 16px;
  }

  .ev-desc {
    font-size: .86rem;
    color: var(--text-secondary);
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .ev-ai-card {
    background: linear-gradient(135deg, rgba(139, 92, 246, .08), rgba(34, 197, 94, .05));
    border: 1px solid rgba(139, 92, 246, .25);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .ev-ai-title {
    font-size: .85rem;
    font-weight: 700;
    color: #a78bfa;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  .ev-ai-text {
    font-size: .84rem;
    color: var(--text-secondary);
    line-height: 1.55;
  }

  .sub-mkt {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: center;
    transition: background .15s;
    cursor: pointer;
  }

  .sub-mkt:last-child {
    border-bottom: 0;
  }

  .sub-mkt:hover,
  .sub-mkt.selected {
    background: rgba(139, 92, 246, .05);
  }

  .sub-mkt.selected {
    border-left: 3px solid var(--accent);
    padding-left: 13px;
  }

  .sub-mkt-meta {
    flex: 1;
    min-width: 0;
  }

  .sub-mkt-q {
    font-size: .92rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.35;
  }

  .sub-mkt-stats {
    display: flex;
    gap: 12px;
    font-size: .72rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .sub-mkt-buttons {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .sub-mkt-btn {
    padding: 10px 14px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: .82rem;
    min-width: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all .15s;
  }

  .sub-mkt-btn:hover {
    transform: scale(1.04);
    filter: brightness(1.1);
  }

  .sub-mkt-btn .sb-label {
    font-size: .66rem;
    opacity: .85;
    font-weight: 500;
    letter-spacing: .02em;
  }

  .sub-mkt-btn .sb-cents {
    font-size: 1.45rem;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }

  .sub-mkt-btn.yes {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    box-shadow: 0 4px 10px rgba(34, 197, 94, .22);
  }

  .sub-mkt-btn.no {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    box-shadow: 0 4px 10px rgba(239, 68, 68, .22);
  }

  .order-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    overflow: hidden;
    position: sticky;
    top: 80px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  }

  .op-balance-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border);
    font-size: .78rem;
  }

  .op-balance-strip .bal {
    color: var(--text-muted);
  }

  .op-balance-strip .bal b {
    color: #22c55e;
    font-size: .92rem;
    margin-left: 4px;
  }

  .op-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .op-tabs {
    display: flex;
  }

  .op-tab {
    background: transparent;
    border: 0;
    padding: 14px 18px;
    color: var(--text-muted);
    cursor: pointer;
    font-weight: 700;
    font-size: .95rem;
    border-bottom: 2px solid transparent;
  }

  .op-tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--accent);
  }

  .op-otype-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .op-otype-select {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-secondary);
    padding: 5px 10px;
    font-size: .78rem;
    cursor: pointer;
  }

  .op-gear {
    background: transparent;
    border: 0;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 6px;
    font-size: 1.05rem;
  }

  .op-gear:hover {
    color: var(--text-primary);
  }

  .op-gear-pop {
    position: absolute;
    top: 48px;
    right: 14px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    width: 240px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    z-index: 50;
  }

  .op-gear-pop h4 {
    margin: 0 0 8px;
    font-size: .82rem;
    color: var(--text-primary);
  }

  .op-gear-pop .gear-item {
    padding: 6px 0;
    font-size: .78rem;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .op-gear-pop .gear-item .gear-tag {
    font-size: .65rem;
    color: var(--text-muted);
    padding: 2px 6px;
    background: var(--bg-primary);
    border-radius: 4px;
  }

  .op-body {
    padding: 16px;
  }

  .op-mkt-info {
    background: var(--bg-primary);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: .82rem;
    color: var(--text-primary);
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .op-outcome-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .op-outcome-btn {
    flex: 1;
    padding: 10px 8px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text-secondary);
    font-weight: 700;
    font-size: .88rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all .15s;
  }

  .op-outcome-btn .qb-out-px {
    font-size: 1.42rem;
    opacity: 1;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }

  .op-outcome-btn.yes-active {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(34, 197, 94, .25);
  }

  .op-outcome-btn.no-active {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(239, 68, 68, .25);
  }

  .ev-share-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(99, 102, 241, .18), rgba(139, 92, 246, .12));
    border: 1px solid rgba(139, 92, 246, .4);
    cursor: pointer;
    transition: all .18s;
    box-shadow: 0 6px 22px rgba(99, 102, 241, .18);
    user-select: none;
  }

  .ev-share-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 28px rgba(99, 102, 241, .30);
    border-color: rgba(139, 92, 246, .65);
  }

  .ev-share-card .ev-share-ico {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(99, 102, 241, .45);
  }

  .ev-share-card .ev-share-text {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .ev-share-card .ev-share-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .ev-share-card .ev-share-sub {
    font-size: .72rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .ev-share-card .ev-share-ref-tag {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: .66rem;
    font-weight: 700;
    background: rgba(34, 197, 94, .18);
    color: #22c55e;
    letter-spacing: .04em;
  }

  .op-section {
    margin-bottom: 14px;
  }

  .op-section-label {
    font-size: .78rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .op-amt-display {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--text-primary);
    text-align: right;
    padding: 6px 0;
    min-height: 1em;
  }

  .op-amt-display.dim {
    color: var(--text-muted);
  }

  .op-quick-amts {
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .op-quick-amt {
    flex: 1;
    padding: 8px 0;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: .82rem;
    font-weight: 600;
    transition: all .12s;
  }

  .op-quick-amt:hover {
    border-color: var(--accent);
    color: var(--text-primary);
  }

  .op-quick-amt.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .op-quick-amt:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .stepper-input {
    display: flex;
    align-items: center;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .stepper-input button {
    background: transparent;
    border: 0;
    width: 40px;
    height: 40px;
    color: var(--text-secondary);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .12s;
  }

  .stepper-input button:hover:not(:disabled) {
    background: var(--bg-card);
    color: var(--accent);
  }

  .stepper-input button:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  .stepper-input input {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    padding: 8px 4px;
    -moz-appearance: textfield;
  }

  .stepper-input input::-webkit-outer-spin-button,
  .stepper-input input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .stepper-input input:focus {
    outline: none;
  }

  .stepper-suffix {
    padding-right: 12px;
    color: var(--text-muted);
    font-size: .85rem;
    font-weight: 500;
  }

  .op-share-adjusts {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: nowrap;
  }

  .op-share-adj {
    flex: 1;
    padding: 6px 0;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: .74rem;
    font-weight: 600;
    transition: all .12s;
  }

  .op-share-adj:hover {
    border-color: var(--accent);
    color: var(--text-primary);
  }

  .op-summary {
    background: var(--bg-primary);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 12px;
  }

  .op-sum-row {
    display: flex;
    justify-content: space-between;
    font-size: .82rem;
    padding: 3px 0;
  }

  .op-sum-row b {
    color: var(--text-primary);
    font-weight: 700;
  }

  .op-sum-row b.profit {
    color: #22c55e;
  }

  .op-sum-row b.cost {
    color: #a78bfa;
  }

  .op-msg {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: .82rem;
  }

  .op-msg.ok {
    background: rgba(16, 185, 129, .10);
    border: 1px solid #10b981;
    color: #6ee7b7;
  }

  .op-msg.err {
    background: rgba(239, 68, 68, .10);
    border: 1px solid #ef4444;
    color: #fca5a5;
  }

  .op-submit {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 10px;
    border: 0;
    cursor: pointer;
    font-weight: 700;
    font-size: .95rem;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
    transition: all .15s;
  }

  .op-submit:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(139, 92, 246, .3);
  }

  .op-submit:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .ev-tabs-nav {
    display: flex;
    gap: 2px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    border-radius: 12px 12px 0 0;
  }

  .ev-tab-btn {
    background: transparent;
    border: 0;
    padding: 12px 18px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: .86rem;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: all .12s;
  }

  .ev-tab-btn:hover {
    color: var(--text-primary);
  }

  .ev-tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .ob-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }

  .ob-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .ob-toggle button {
    background: transparent;
    color: var(--text-muted);
    padding: 4px 12px;
    border: 0;
    font-size: .78rem;
    cursor: pointer;
    transition: all .15s;
  }

  .ob-toggle button.active.yes {
    background: rgba(34, 197, 94, .18);
    color: #22c55e;
    font-weight: 600;
  }

  .ob-toggle button.active.no {
    background: rgba(239, 68, 68, .18);
    color: #ef4444;
    font-weight: 600;
  }

  .ob-table {
    display: block;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: .78rem;
  }

  .ob-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 6px 10px;
    color: var(--text-muted);
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .6px;
    background: rgba(255, 255, 255, .02);
    border-bottom: 1px solid var(--border);
  }

  .ob-header span:nth-child(2),
  .ob-header span:nth-child(3) {
    text-align: right;
  }

  .ob-section {
    display: block;
  }

  .ob-section.asks .ob-row {
    color: #fca5a5;
  }

  .ob-section.bids .ob-row {
    color: #86efac;
  }

  .ob-row {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 3px 10px;
    cursor: pointer;
    transition: background .1s;
    font-variant-numeric: tabular-nums;
  }

  .ob-row:hover {
    background: rgba(255, 255, 255, .04);
  }

  .ob-row .ob-cell-bar {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    opacity: .18;
  }

  .ob-section.asks .ob-row .ob-cell-bar {
    background: linear-gradient(to left, #ef4444, #ef4444 var(--depth, 0%), transparent var(--depth, 0%));
  }

  .ob-section.bids .ob-row .ob-cell-bar {
    background: linear-gradient(to left, #22c55e, #22c55e var(--depth, 0%), transparent var(--depth, 0%));
  }

  .ob-row span {
    position: relative;
    z-index: 1;
  }

  .ob-row span:nth-child(2),
  .ob-row span:nth-child(3) {
    text-align: right;
  }

  .ob-row .ob-price {
    font-weight: 600;
  }

  .ob-spread {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: rgba(255, 255, 255, .03);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: .78rem;
    color: var(--text-secondary);
  }

  .ob-spread .ob-last {
    font-weight: 600;
    color: var(--text-primary);
  }

  .ob-spread .ob-spread-val {
    color: var(--text-muted);
    font-size: .72rem;
  }

  .ob-empty {
    padding: 14px 10px;
    color: var(--text-muted);
    font-size: .78rem;
    text-align: center;
  }

  .empty-tab {
    padding: 30px;
    text-align: center;
    color: var(--text-muted);
    font-size: .86rem;
  }

  @keyframes shimmer {
    0% {
      background-position: -400px 0;
    }

    100% {
      background-position: 400px 0;
    }
  }

  @keyframes spinrot {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  .skel-line,
  .skel-block {
    background: linear-gradient(90deg, rgba(139, 92, 246, .06) 0%, rgba(139, 92, 246, .22) 50%, rgba(139, 92, 246, .06) 100%);
    background-size: 800px 100%;
    animation: shimmer 1.4s linear infinite;
    border-radius: 6px;
  }

  .skel-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 38px;
    height: 38px;
    border: 3px solid rgba(139, 92, 246, .18);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spinrot .9s linear infinite;

   *   - 紧凑且仍易读的间距，腾出更多内容面积
   *   - KPI / 标签栏 / 选项卡可水平滚动 + 吸附，避免折行抖动
   *   - 触控目标 ≥ 44×44，安全区适配 iOS Home 指示条
   *   - 交易面板"贴底悬浮"：用户在任何位置都能一指可达，无需滚到底
   *
   * 所有规则仅作用于 ≤768px，桌面/平板布局完全不受影响。
   * 全部沿用既有 token：var(--bg-card) / var(--border) / var(--accent) /
   * var(--text-primary) / var(--text-secondary) / var(--text-muted) /
   * var(--bg-primary)。无新增组件、无新增 DOM、无 JS 变更。
   * ===================================================================== */

    /* —— 0. 横向溢出兜底：所有 grid/section/order-panel 子元素都不允许超出 —— */

    #ev-app-root .ev-grid,
    #ev-app-root .ev-grid>*,
    #ev-app-root .ev-section-card,
    #ev-app-root .ev-section-card>*,

    #ev-app-root .order-panel>* {

      max-width: 100%;

    #ev-app-root .ev-grid {
      overflow-x: clip;

      gap: 12px;

      gap: 12px;
      margin-top: 12px;
    }

      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    }

      padding: 10px 12px;

    }

      padding: 0 8px;

      flex-wrap: nowrap;

      -webkit-overflow-scrolling: touch;

    #ev-app-root .ev-section-card>div[style*="max-height"] {
      max-height: 46vh !important;

    /* —— 8. 交易面板（移动端）：保持静态布局并优化触感 —— */
    /* 设计取舍：sticky-bottom 会与上方 Markets 卡的 YES/NO 按钮在 z 轴叠加导致视觉
     * 冲突；改为静态流式布局 + 紧凑触控目标，配合上方所有内容卡的 token 紧凑化，
     * 用户可在 1–2 次轻滑内达到交易面板，且不会遮挡任何上下文信息。 */
    #ev-app-root .ev-right-sticky {
