{% extends "base.html" %}

{% block title %}V e Y r a - Feature Management{% endblock %}

{% block content %}
<script>
  if (document.body) document.body.setAttribute('data-requires-pm', '1');
</script>
<style>
  #vp-config-root .cfg-hero {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    background:
      radial-gradient(120% 160% at 92% -30%, rgba(245, 158, 11, 0.22) 0%, rgba(245, 158, 11, 0) 56%),
      radial-gradient(120% 130% at -14% -35%, rgba(51, 102, 255, 0.30) 0%, rgba(51, 102, 255, 0) 60%),
      linear-gradient(165deg, rgba(20, 28, 43, 0.94), rgba(16, 24, 40, 0.97));
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.34);
  }

  #vp-config-root .cfg-hero-kicker {
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #vp-config-root .cfg-hero-title {
    margin: 0;
    font-size: clamp(24px, 3vw, 34px);
    line-height: 1.15;
    color: var(--text-primary);
  }

  #vp-config-root .cfg-hero-sub {
    margin-top: 10px;
    color: var(--text-secondary);
    font-size: 14px;
    max-width: 760px;
  }

  #vp-config-root .cfg-hero-tags {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  #vp-config-root .cfg-chip {
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.04);
  }

  #vp-config-root .cfg-tab-shell {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(20, 28, 43, 0.92), rgba(20, 28, 43, 0.66));
    padding: 8px;
  }

  #vp-config-root .cfg-tabs {
    border-bottom: 0;
    margin-bottom: 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  #vp-config-root .cfg-tabs .v-tab {
    border: 1px solid transparent;
    border-bottom: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 10px 14px;
  }

  #vp-config-root .cfg-tabs .v-tab:hover {
    border-color: rgba(255, 255, 255, 0.10);
    background: rgba(255, 255, 255, 0.03);
  }

  #vp-config-root .cfg-tabs .v-tab.active {
    border-color: rgba(51, 102, 255, 0.28);
    background: linear-gradient(180deg, rgba(51, 102, 255, 0.20), rgba(51, 102, 255, 0.08));
    color: var(--text-primary);
    box-shadow: inset 0 0 0 1px rgba(51, 102, 255, 0.24);
  }

  #vp-config-root .cfg-panel {
    min-height: 180px;
  }

  #vp-config-root .cfg-tone-info {
    background: linear-gradient(160deg, rgba(51, 102, 255, 0.16), rgba(20, 28, 43, 0.88));
    border: 1px solid rgba(51, 102, 255, 0.25);
  }

  #vp-config-root .cfg-tone-accent {
    background: linear-gradient(160deg, rgba(245, 158, 11, 0.16), rgba(20, 28, 43, 0.88));
    border: 1px solid rgba(245, 158, 11, 0.24);
  }

  #vp-config-root .cfg-tone-muted {
    background: linear-gradient(160deg, rgba(148, 163, 184, 0.12), rgba(20, 28, 43, 0.88));
    border: 1px solid rgba(148, 163, 184, 0.2);
  }

  #vp-config-root .cfg-table thead th {
    color: var(--text-secondary);
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  #vp-config-root .cfg-panel .v-card {
    animation: cfgCardIn 0.34s ease both;
  }

  #vp-config-root .cfg-panel .v-card:nth-child(2) {
    animation-delay: 0.04s;
  }

  #vp-config-root .cfg-panel .v-card:nth-child(3) {
    animation-delay: 0.08s;
  }

  @keyframes cfgCardIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  #vp-config-root .cfg-loading {
    display: grid;
    place-items: center;
    min-height: 220px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    color: var(--text-muted);
    background: rgba(20, 28, 43, 0.45);
  }

  @media (max-width: 768px) {
    #vp-config-root .cfg-hero {
      padding: 16px;
      border-radius: 14px;
    }

    #vp-config-root .cfg-tabs .v-tab {
      flex: 1 1 calc(50% - 8px);
      justify-content: center;
    }
  }

  @media (max-width: 480px) {
    #vp-config-root .cfg-tabs .v-tab {
      flex: 1 1 100%;
    }
  }
</style>

{% block scripts %}
<script>
  if (window.veyraI18n && typeof window.veyraI18n.registerPagePack === 'function') {
    window.veyraI18n.registerPagePack('config');
  }
</script>
<script>
  function configApp() {
    return {
      tab: 'points',
      points: { balance: 0, tier: '-', total_earned: 0, this_month: 0, redeemed: 0, next_tier_pts: 0, history: [] },
      fees: { rate: 0, total: 0, this_month: 0, history: [] },
      strategy: {
        auto_bet: false, copy_trade: false, stop_loss: false, telegram_notify: false, trade_notify: false,
        max_single_bet_pct: 0.03, daily_loss_pct: 0.5, min_ev: 0.04, dry_run: true
      },
      ctSettings: {
        enabled: true, scan_interval_seconds: 60, max_concurrent_follows: 3,
        trade_mode: 'taker', trade_mode_options: ['taker', 'maker'], trade_mode_locked: true,
        follow_multiplier: 1, min_order_size_buffer_shares: 1,
        min_ev_filter: 0.002, max_price_filter: 0.85, follow_sell_enabled: true,
        trade_lookback_minutes: 30, exclude_bots: true, min_score: 0
      },
      pointsLoading: false,
      feesLoading: false,
      stratLoading: false,
      ctLoading: false,
      strategyAccordionOpen: true,
      ctSaveMsg: '',
      ctSaveOk: true,

      async init() {
        await this.loadPoints();
        if (window.lucide) lucide.createIcons();
      },

      async loadPoints() {
        this.pointsLoading = true;
        const d = await vJson('/api/user/points');
        if (d) {
          this.points = {
            ...this.points,
            balance: d.balance ?? 0,
            total_earned: d.total_earned ?? 0,
            this_month: d.this_month ?? 0,
            redeemed: d.total_spent ?? 0,
            history: d.recent_transactions || [],
          };
        }
        this.pointsLoading = false;
      },

      async loadFees() {
        if (this.fees.history.length > 0) return;
        this.feesLoading = true;
        const d = await vJson('/api/user/fees');
        if (d) this.fees = { ...this.fees, ...d };
        this.feesLoading = false;
      },

      async loadStrategy() {
        if (this.stratLoading) return;
        this.stratLoading = true;
        const d = await vJson('/api/user/strategy');
        if (d) this.strategy = { ...this.strategy, ...d };
        this.stratLoading = false;
        await this.loadCtSettings();
      },

      async loadCtSettings() {
        if (this.ctLoading) return;
        this.ctLoading = true;
        try {
          const resp = await fetch('/api/v2/copytrader/settings', { credentials: 'include' });
          const d = await resp.json();
          if (d && d.settings) this.ctSettings = { ...this.ctSettings, ...d.settings };
        } catch (e) { }
        this.ctLoading = false;
      },

      async ctToggle(key) {
        this.ctSettings[key] = !this.ctSettings[key];
        await this.ctSave();
      },

      async ctSave() {
        this.ctSaveMsg = '';
        try {
          this.ctSettings.trade_mode = 'taker';
          this.ctSettings.trade_mode_options = ['taker', 'maker'];
          this.ctSettings.trade_mode_locked = true;
          this.ctSettings.follow_multiplier = Math.max(1, Math.min(1000, parseInt(this.ctSettings.follow_multiplier || 1, 10) || 1));
          const resp = await fetch('/api/v2/copytrader/settings', {
            method: 'PUT',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ settings: this.ctSettings }),
          });
          const d = await resp.json().catch(() => null);
          if (resp.ok && d && d.ok) {
            this.ctSaveOk = true;
            this.ctSaveMsg = '{{ i18n_dict.get("config.copytrader.saved","Saved") }}';
          } else {
            this.ctSaveOk = false;
            this.ctSaveMsg = '{{ i18n_dict.get("config.copytrader.saveFailed","Save failed") }}';
          }
        } catch (e) {
          this.ctSaveOk = false;
          this.ctSaveMsg = '{{ i18n_dict.get("config.copytrader.saveFailed","Save failed") }}';
        }
        setTimeout(() => { this.ctSaveMsg = ''; }, 3000);
      },

      async setCtMultiplier(v) {
        this.ctSettings.follow_multiplier = Number(v) || 1;
        await this.ctSave();
      },

      async toggleStrategy(key) {
        this.strategy[key] = !this.strategy[key];
        const resp = await vFetch('/api/user/strategy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ [key]: this.strategy[key] }),
        });
        if (!resp || !resp.ok) {
          this.strategy[key] = !this.strategy[key];
          const _t = (window.veyraI18n && window.veyraI18n.t) ? window.veyraI18n.t : function (k, fb) { return fb; };
          showToast(_t('config.toast.strategySaveFailed', 'Strategy save failed'), 'error');
          return;
        }
        const d = await resp.json().catch(() => null);
        if (d) {
          this.strategy = { ...this.strategy, ...d };
        }
      },
    };
  }
</script>
{% endblock %}
