<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeYra.trade</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="modulepreload" href="/v2/static/js/vendor/mfa_runtime_bundle.mjs" as="script" crossorigin="anonymous">
  <style>
    :root {
      --bg: #0f1115;
      --tile-bg: #0a0b0e;
      --card-bg: #0d1017;
      --cta-accent: #2ee68b;
      --cta-accent-2: #16c172;
      --muted: #6b7280;
      --yes: #22c55e;
      --no: #ef4444;
      --card-w: 260px;
      --card-h: 120px;
      --card-gap: 4px;
      --tile-pad: 10px;
      --font: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .logo-full {
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      will-change: transform;
    }

    .tile {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: var(--tile-bg);
      pointer-events: auto;
      overflow: hidden;
      backface-visibility: hidden;
      will-change: transform;
    }

    .tile-grid {
      width: max-content;
      height: max-content;
      display: grid;
      grid-template-columns: repeat(7, var(--card-w));
      grid-template-rows: repeat(7, var(--card-h));
      gap: var(--card-gap);
      padding: var(--tile-pad);
      background: rgba(255, 255, 255, 0.04);
    }

    @media (max-width:900px) {
      :root {
        --card-w: 220px;
        --card-h: 108px;
      }

      .tile-grid {
        grid-template-columns: repeat(5, var(--card-w));
        grid-template-rows: repeat(5, var(--card-h));
      }
    }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #9aa0a6;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.18s ease;
      cursor: col-resize;
      position: relative;
      opacity: 0.82;
    }

    .card:hover {
      background: #111520;
      border-color: rgba(255, 184, 107, 0.2);
      z-index: 2;
      opacity: 0.9;
    }

    .card-inner {
      padding: 9px 9px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      height: 100%;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #c9cfd8;
      line-height: 1.35;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-btns {
      display: flex;
      gap: 4px;
    }

    .card-btn {
      flex: 1;
      padding: 4px 0;
      border: 0;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
    }

    .card-btn-yes {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .card-btn-no {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .card-bar {
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
    }

    .card-bar-yes {
      background: linear-gradient(90deg, #22c55e, #16a34a);
    }

    .card-bar-no {
      background: linear-gradient(90deg, #ef4444, #dc2626);
    }

    .card-label {
      font-size: 10px;
      color: #6b7280;
      text-align: center;
      padding: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cta-stage {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      z-index: 100;
      pointer-events: none;
    }

    .cta-overlay {
      position: relative;
      width: 100%;
      min-height: 360px;
      padding: 26px 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1f2937 0%, #1D2939 50%, #101828 100%);
      border-radius: 18px;
      pointer-events: auto;
      border: 1px solid rgba(46, 230, 139, 0.26);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), 0 40px 80px rgba(0, 0, 0, 0.72), inset 0 0 40px rgba(46, 230, 139, 0.06);
    }

    .cta-side-link {
      position: absolute;
      left: calc(100% - 1px);
      top: 50%;
      transform: translateY(-52%);
      width: 200px;
      height: auto;
      pointer-events: auto;
      z-index: 102;
      display: block;
      line-height: 0;
      transition: transform 0.25s cubic-bezier(.2, .9, .3, 1.2), filter 0.25s ease;
      text-decoration: none;
    }

    .cta-side-link:hover {
      transform: translateY(-54%) translateX(2px) scale(1.02);
    }

    .cta-side-link img {
      width: 190px;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 1100px) {
      .cta-side-link {
        left: calc(100% - 1px);
        width: 190px;
      }
    }

    @media (max-width: 760px) {
      .cta-side-link {
        display: none;
      }
    }

    .cta-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .cta-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
    }

    .cta-title {
      color: #fff;
      font-weight: 800;
      font-size: 30px;
      text-align: center;
      line-height: 1.1;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .cta-desc {
      color: #8ba09a;
      font-size: 13.5px;
      max-width: 480px;
      text-align: center;
      line-height: 1.5;
    }

    .lang-footer {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      margin-bottom: 16px;
    }

    .lang-btn {
      background: rgba(46, 230, 139, 0.10);
      color: #9bf6ca;
      border: 1px solid rgba(46, 230, 139, 0.24);
      border-radius: 8px;
      width: auto;
      min-width: 44px;
      height: 30px;
      padding: 0 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
      line-height: 1;
    }

    .lang-btn:hover,
    .lang-btn.active {
      background: rgba(46, 230, 139, 0.22);
      color: #d8ffec;
    }

    .btn {
      width: 100%;
      background: linear-gradient(90deg, var(--cta-accent), var(--cta-accent-2));
      color: #032115;
      border: none;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.35px;
      transition: all 0.15s;
      box-shadow: 0 8px 20px rgba(46, 230, 139, 0.22);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      margin-top: 8px;
      width: 100%;
      background: rgba(46, 230, 139, 0.08);
      color: #b8f8d8;
      border: 1px solid rgba(46, 230, 139, 0.30);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      background: rgba(46, 230, 139, 0.16);
    }

    .btn-secondary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 4px;
      font-size: 12.5px;
      border-radius: 8px;
      padding: 8px 12px;
      display: none;
      width: 100%;
      font-family: "Courier New", monospace;
      letter-spacing: 0.2px;
      position: relative;
    }

    .msg::after {
      content: '▋';
      display: inline-block;
      animation: blink-cursor 1s step-end infinite;
      margin-left: 1px;
      opacity: 0.8;
    }

    @keyframes blink-cursor {

      0%,
      100% {
        opacity: 0.8;
      }

      50% {
        opacity: 0;
      }
    }

    .msg.show {
      display: block;
    }

    .msg.info {
      background: rgba(30, 170, 104, 0.16);
      color: #95f5c8;
    }

    .msg.ok {
      background: rgba(34, 197, 94, 0.20);
      color: #b4ffd8;
    }

    .msg.err {
      background: rgba(239, 68, 68, 0.18);
      color: #fecaca;
    }

    .tips {
      margin-top: 0;
      color: #7f938e;
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
      width: 100%;
      padding-top: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 10px 16px;
      overflow: hidden;
    }

    .cta-trust {
      pointer-events: auto;
      margin-top: 2px;
      padding-top: 10px;
      border-top: 1px solid rgba(46, 230, 139, 0.18);
    }

    .trust-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(10px, 1.2vw, 12px);
      color: #c9d7d2;
      margin: 0;
      line-height: 1.2;
      min-width: 0;
      justify-content: flex-start;
      white-space: nowrap;
    }

    .trust-row span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trust-row i {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .trust-icon-emerald {
      color: #34d399;
    }

    .trust-icon-amber {
      color: #f59e0b;
    }

    .trust-icon-sky {
      color: #38bdf8;
    }

    .trust-icon-violet {
      color: #a78bfa;
    }

    @media (max-width:700px) {
      .cta-stage {
        width: min(95%, 640px);
      }

      .cta-overlay {
        width: 100%;
        min-height: 400px;
        padding: 18px 16px;
      }

      .cta-head {
        flex-direction: column;
        align-items: center;
      }

      .cta-title {
        font-size: 24px;
        white-space: normal;
      }

      .tips {
        grid-template-columns: 1fr;
      }

      .logo-full {
        height: 24px;
      }
    }
  </style>
</head>

<body>
  <div id="viewport">
    <div id="canvas"></div>
  </div>

  <div class="cta-stage" id="cta-stage">
    <div class="cta-overlay" id="cta-overlay">
      <a href="https://veyra.trade" class="cta-side-link" id="cta-side-link" aria-label="Guest Preview">
        <img src="/static/Veyragirl.png" alt="Guest Preview" decoding="async" loading="eager">
      </a>
      <div class="cta-head">
        <div class="cta-brand">
          <img class="logo-full" src="/static/Veyra.png" alt="V e Y r a" decoding="async" fetchpriority="high">
          <div class="cta-title" id="cta-title"></div>
        </div>
      </div>
      <div class="cta-desc" id="cta-desc"></div>
      <div id="app" style="width:min(460px,100%)"></div>
      <div class="lang-footer" id="lang-footer">
        <button type="button" class="lang-btn" data-lang="en" title="English" aria-label="English">🇺🇸</button>
        <button type="button" class="lang-btn" data-lang="zh-CN" title="中文" aria-label="中文">🇨🇳</button>
        <button type="button" class="lang-btn" data-lang="fr" title="Français" aria-label="Français">🇫🇷</button>
        <button type="button" class="lang-btn" data-lang="ja" title="日本語" aria-label="日本語">🇯🇵</button>
        <button type="button" class="lang-btn" data-lang="ko" title="한국어" aria-label="한국어">🇰🇷</button>
        <button type="button" class="lang-btn" data-lang="th" title="ไทย" aria-label="ไทย">🇹🇭</button>
        <button type="button" class="lang-btn" data-lang="vi" title="Tiếng Việt" aria-label="Tiếng Việt">🇻🇳</button>
        <button type="button" class="lang-btn" data-lang="es" title="Español" aria-label="Español">🇪🇸</button>
        <button type="button" class="lang-btn" data-lang="pt" title="Português" aria-label="Português">🇵🇹</button>
      </div>
      <div class="tips cta-trust" id="cta-tips"></div>
    </div>
  </div>

  <script src="/v2/static/js/vendor/lucide.min.js"></script>
  <script>
    (function () {
      const I18N = {
        en: {},
        'zh-CN': {},
        fr: {},
        ja: {},
        ko: {},
        th: {},
        vi: {},
        es: {},
        pt: {},
      };

      function normalizeLang(raw) {
        const s = String(raw || '').toLowerCase();
        if (s.startsWith('zh')) return 'zh-CN';
        if (s.startsWith('fr')) return 'fr';
        if (s.startsWith('ja')) return 'ja';
        if (s.startsWith('ko')) return 'ko';
        if (s.startsWith('th')) return 'th';
        if (s.startsWith('vi')) return 'vi';
        if (s.startsWith('es')) return 'es';
        if (s.startsWith('pt')) return 'pt';
        return 'en';
      }

      const storedLang = normalizeLang(localStorage.getItem('veyra_lang') || localStorage.getItem('vp_lang') || navigator.language || 'en');
      const dynamicI18nLoaded = new Set();
      const i18nState = {
        dict: I18N,
        lang: storedLang,
        t(key) {
          const pack = this.dict[this.lang] || this.dict.en;
          const fallback = this.dict.en || {};
          return pack[key] ?? fallback[key] ?? '';
        },
        async ensureLangPack(lang) {
          const normalized = normalizeLang(lang || this.lang);
          if (dynamicI18nLoaded.has(normalized)) return;
          try {
            const resp = await fetch('/v2/static/i18n/' + encodeURIComponent(normalized) + '.json', { cache: 'no-store' });
            if (!resp.ok) return;
            const data = await resp.json();
            if (data && typeof data === 'object') {
              this.dict[normalized] = Object.assign({}, this.dict[normalized] || {}, data);
              dynamicI18nLoaded.add(normalized);
            }
          } catch (_) { }
        },
        setLang(nextLang) {
          this.lang = normalizeLang(nextLang);
          localStorage.setItem('veyra_lang', this.lang);
          localStorage.setItem('vp_lang', this.lang);
          try { document.cookie = 'veyra_lang=' + this.lang + '; path=/; max-age=31536000; SameSite=Lax'; } catch (_) { }
          window.dispatchEvent(new CustomEvent('index-lang-change', { detail: { lang: this.lang } }));
        },
      };
      try {
        localStorage.setItem('veyra_lang', i18nState.lang);
        localStorage.setItem('vp_lang', i18nState.lang);
        document.cookie = 'veyra_lang=' + i18nState.lang + '; path=/; max-age=31536000; SameSite=Lax';
      } catch (_) { }
      window.__indexI18n = i18nState;

      function applyStaticI18n() {
        const titleEl = document.getElementById('cta-title');
        const descEl = document.getElementById('cta-desc');
        const tipsEl = document.getElementById('cta-tips');
        if (titleEl) titleEl.textContent = i18nState.t('cta_title');
        if (descEl) descEl.textContent = i18nState.t('cta_desc');
        if (tipsEl) {
          tipsEl.innerHTML = '';
          var rows = [
            { icon: 'shield-check', cls: 'trust-icon-emerald', key: 'trust_point_1' },
            { icon: 'vault', cls: 'trust-icon-amber', key: 'trust_point_2' },
            { icon: 'zap', cls: 'trust-icon-sky', key: 'trust_point_3' },
            { icon: 'brain', cls: 'trust-icon-violet', key: 'trust_point_4' }
          ];
          rows.forEach(function (item) {
            var row = document.createElement('div');
            row.className = 'trust-row';
            row.innerHTML = '<i data-lucide="' + item.icon + '" class="' + item.cls + '"></i><span>' + i18nState.t(item.key) + '</span>';
            tipsEl.appendChild(row);
          });
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons({
              attrs: {
                'stroke-width': 2
              }
            });
          }
        }
        document.documentElement.lang = i18nState.lang;
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === i18nState.lang);
        });
      }

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          i18nState.setLang(btn.getAttribute('data-lang') || 'en');
          applyStaticI18n();
        });
      });
      applyStaticI18n();

      const viewport = document.getElementById('viewport');
      const canvas = document.getElementById('canvas');

      let vw = window.innerWidth;
      let vh = window.innerHeight;
      const tiles = [];
      let homepageCards = [];
      let synthTitles = [];

      function gridCols() { return (vw <= 900) ? 5 : 7; }
      function gridRows() { return gridCols(); }
      function cssPx(name, fallback) {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        const n = parseFloat(v);
        return Number.isFinite(n) ? n : fallback;
      }

      function synthCard(gx, gy, r, c) {
        const hash = Math.abs((gx * 7919 + gy * 6271 + r * 1031 + c * 397) & 0x7fffffff);
        const fallback = i18nState.t('synth_titles');
        const titles = synthTitles.length
          ? synthTitles
          : (Array.isArray(fallback) ? fallback : []);
        const title = titles[hash % titles.length] || '';
        const yesP = Math.round((0.05 + (hash % 900) / 1000) * 1000) / 1000;
        const noP = Math.round((1 - yesP) * 1000) / 1000;
        return { title, yes_price: yesP, no_price: noP, volume_24h: null, liquidity: null, days_left: null };
      }

      function fmtPct(p) {
        if (p === null || p === undefined) return '';
        return (p * 100).toFixed(1) + '%';
      }

      function fmtVol(v) {
        if (!v || v <= 0) return '';
        if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
        if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'K';
        return '$' + v.toFixed(0);
      }

      function getCardHTML(gx, gy, r, c) {
        const cols = (vw <= 900) ? 5 : 7;
        const idx = r * cols + c;
        let card;
        if (gx === 0 && gy === 0 && idx < homepageCards.length) {
          card = homepageCards[idx];
        } else {
          card = synthCard(gx, gy, r, c);
        }

        const title = (card.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const yesP = card.yes_price;
        const noP = card.no_price;
        const hasPrice = (yesP !== null && yesP !== undefined);
        const yesPct = hasPrice ? fmtPct(yesP) : '';
        const noPct = hasPrice ? fmtPct(noP) : '';
        const yesBar = hasPrice ? Math.round(yesP * 100) : 50;
        const noBar = 100 - yesBar;
        const vol = card.volume_24h ? fmtVol(card.volume_24h) : '';
        const footer = vol
          ? vol + ' ' + i18nState.t('footer_24h')
          : (card.days_left !== null && card.days_left !== undefined ? card.days_left + i18nState.t('footer_days') : '');

        return `<div class="card"><div class="card-inner">` +
          `<div class="card-title">${title}</div>` +
          `<div class="card-btns">` +
          `<div class="card-btn card-btn-yes">${i18nState.t('card_yes')} ${yesPct}</div>` +
          `<div class="card-btn card-btn-no">${i18nState.t('card_no')} ${noPct}</div>` +
          `</div>` +
          `<div class="card-bar"><div class="card-bar-yes" style="width:${yesBar}%"></div><div class="card-bar-no" style="width:${noBar}%"></div></div>` +
          (footer ? `<div class="card-label">${footer}</div>` : '') +
          `</div></div>`;
      }

      async function loadHomepageCards() {
        try {
          const r = await fetch('/api/public/homepage/cards', { credentials: 'include' });
          const d = await r.json().catch(() => ({}));
          if (r.ok && d && d.ok && Array.isArray(d.cards)) {
            homepageCards = d.cards
              .filter((x) => x && x.enabled !== false)
              .sort((a, b) => Number(a.sort_order || 100) - Number(b.sort_order || 100))
              .map((x) => ({
                title: String((x.title_i18n_key ? i18nState.t(x.title_i18n_key) : '') || x.title_i18n_key || x.title || '').trim(),
                yes_price: x.yes_price != null ? Number(x.yes_price) : null,
                no_price: x.no_price != null ? Number(x.no_price) : null,
                volume_24h: x.volume_24h != null ? Number(x.volume_24h) : null,
                liquidity: x.liquidity != null ? Number(x.liquidity) : null,
                days_left: x.days_left != null ? Number(x.days_left) : null,
              }));
          }
        } catch (_) { }
      }

      async function loadSynthTitles() {
        try {
          const lang = encodeURIComponent(i18nState.lang || 'en');
          const r = await fetch(`/api/public/homepage/synth-titles?lang=${lang}&limit=24`, {
            credentials: 'include',
            cache: 'no-store',
          });
          const d = await r.json().catch(() => ({}));

      async function confirmEnroll() {

          }),
          React.createElement('button', {
            onClick: confirmEnroll, disabled: busy,
            style: { width: '100%', marginTop: 12, padding: 10, border: 0, borderRadius: 8, background: '#2563eb', color: '#fff', fontWeight: 600, cursor: 'pointer' },
          }, t('mfa_totp_confirm'))

      }

      return React.createElement(TypewriterMessage, { msg });
    }

    function LoginInner() {
      const privy = usePrivy();
      const { ready, authenticated, user, logout } = privy;
      const walletState = useWallets ? useWallets() : {};
      const wallets = Array.isArray(walletState && walletState.wallets) ? walletState.wallets : [];
      const walletsReady = !!(walletState && walletState.ready);
      const identityTokenState = useIdentityToken ? useIdentityToken() : {};
      const identityToken = (identityTokenState && typeof identityTokenState.identityToken === 'string')
        ? identityTokenState.identityToken
        : '';
      const getIdentityTokenFromHook = (identityTokenState && typeof identityTokenState.getIdentityToken === 'function')
        ? identityTokenState.getIdentityToken
        : null;
      const { init: initMfa, promptMfa, showMfaPromptModal } = useMfa ? useMfa() : {
        init: null,
        promptMfa: null,
        showMfaPromptModal: null,
      };
      const getAccessToken = privy.getAccessToken || (async () => '');
      const getIdentityToken =
        (typeof privy.getIdentityToken === 'function' && privy.getIdentityToken.bind(privy))
        || getIdentityTokenFromHook
        || (typeof getIdentityTokenGlobal === 'function' ? getIdentityTokenGlobal : null)
        || (async () => identityToken || '');
      const [busy, setBusy] = useState(false);
      const popupTimerRef = useRef(null);
      const manualTriggerRef = useRef(false);
      const completedLoginRef = useRef(false);
      const hardResetRetryRef = useRef(false);
      const FAST_REDIRECT_MS = 120;
      const [msg, setMsg] = useState({ type: 'info', text: t('msg_login_waiting'), show: true });

      const loginHookState = useLogin ? useLogin({
        onError: (error) => {
          clearPopupTimer();
          manualTriggerRef.current = false;
          completedLoginRef.current = false;
          setMsg({ type: 'err', text: t('msg_privy_login_failed') + (error?.message || String(error)), show: true });
          setBusy(false);
        },
      }) : {};
      const loginFn = (loginHookState && typeof loginHookState.login === 'function')
        ? loginHookState.login

      React.useEffect(() => {

      function clearPopupTimer() {

          popupTimerRef.current = null;
        }
      }

      function clearPrivyBrowserState() {
        try {
          const keys = [];
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);
            if (key && key.toLowerCase().startsWith('privy:')) keys.push(key);
          }
          keys.forEach((key) => {
            try { localStorage.removeItem(key); } catch (_) { }

        } catch (_) { }

          document.cookie = 'privy-session=; Max-Age=0; path=/; SameSite=Lax';
          document.cookie = 'privy-token=; Max-Age=0; path=/; SameSite=Lax';

        } catch (_) { }
      }

      async function clearBackendSessionBestEffort() {
        try {
          await fetch('/api/user/logout', {
            method: 'POST',
            credentials: 'include',
          });
        } catch (_) { }
      }

      async function resetHomepageSession() {
        try {
          if (typeof logout === 'function') {
            await logout();
          }
        } catch (_) { }

        clearPrivyBrowserState();
      }

      const primaryWallet = useMemo(() => {
        const userWalletAddress = user && user.wallet && user.wallet.address
          ? String(user.wallet.address).toLowerCase()
          : '';
        const connectedWallet = userWalletAddress
          ? wallets.find((wallet) => wallet && String(wallet.address || '').toLowerCase() === userWalletAddress)
          : null;
        if (connectedWallet && connectedWallet.address) {
          return String(connectedWallet.address).toLowerCase();
        }
        if (userWalletAddress) return userWalletAddress;
        if (!user) return '';
        const linked = Array.isArray(user.linkedAccounts) ? user.linkedAccounts : [];
        const w = linked.find((a) => a && a.address);
        return w && w.address ? String(w.address).toLowerCase() : '';
      }, [user, wallets]);

      const normalizeMfaMethods = (arr) => {
        if (!Array.isArray(arr)) return [];
        const out = [];
        arr.forEach((m) => {
          const k = String(m || '').toLowerCase().trim();
          if (!k) return;
          if (out.includes(k)) return;
          out.push(k);
        });
        return out;
      };

      const getKnownMfaMethods = (candidateUser) => {
        if (!candidateUser || typeof candidateUser !== 'object') return [];
        return normalizeMfaMethods(candidateUser.mfaMethods || candidateUser.mfa_methods || []);
      };

      async function runLoginMfaPrompt(methods) {
        // T902: 登录 MFA 改为服务端 TOTP —— 采集 6 位验证码，由后端校验。
        setMsg({ type: 'info', text: t('msg_mfa_secondary'), show: true });
        const code = await promptTotpCode();
        if (!code) {
          throw new Error(t('err_mfa_prompt_unavailable'));
        }
        return code;
      }

      async function readJsonSafe(resp) {
        try {
          return await resp.json();
        } catch (_) {
          return {};
        }

      async function completeLogin(currentUser) {
        clearPopupTimer();
        setBusy(true);
        setMsg({ type: 'info', text: t('msg_verify_token'), show: true });
        try {
          const candidateUser = currentUser || user || {};
          let knownMfaMethods = getKnownMfaMethods(candidateUser);

          const normalizeIdToken = (tokenValue) => {
            if (!tokenValue) return '';
            if (typeof tokenValue === 'string') return tokenValue.trim();
            if (typeof tokenValue === 'object') {
              const cands = [
                tokenValue.identityToken,
                tokenValue.idToken,
                tokenValue.id_token,
                tokenValue.token,
              ];
              for (const v of cands) {
                if (typeof v === 'string' && v.trim()) return v.trim();
              }
            }
            return '';
          };

          const normalizeAccessToken = (tokenValue) => {
            if (!tokenValue) return '';
            if (typeof tokenValue === 'string') return tokenValue.trim();
            if (typeof tokenValue === 'object') {
              const cands = [
                tokenValue.accessToken,
                tokenValue.access_token,
                tokenValue.token,
              ];
              for (const v of cands) {
                if (typeof v === 'string' && v.trim()) return v.trim();
              }
            }
            return '';
          };

          const readAuthTokens = async () => {
            let nextAccessToken = '';
            for (let attempt = 0; attempt < 3 && !nextAccessToken; attempt++) {
              if (attempt > 0) await new Promise(r => setTimeout(r, 150));
              try {

              } catch (_) {

            }
            let nextIdToken = '';
            if (!nextAccessToken) {
              try {

              } catch (_) {
                nextIdToken = normalizeIdToken(identityToken);
              }
              if (!nextIdToken && identityToken) {
                nextIdToken = normalizeIdToken(identityToken);
              }
            }
            return { accessToken: nextAccessToken, idToken: nextIdToken };
          };

          // T794: Capture referral code from ?ref= URL param and persist in localStorage.
          try {
            const _refParam = new URLSearchParams(window.location.search).get('ref');
            if (_refParam && /^[A-Z0-9]{4,20}$/i.test(_refParam)) {
              localStorage.setItem('veyra_ref_code', _refParam.toUpperCase());
            }
          } catch (_) { }

          const doServerVerify = async (verifiedFlag, authTokens, mfaCode) => fetch('/api/user/privy/verify', {
            method: 'POST',
            credentials: 'include',
            headers: {
              'Content-Type': 'application/json',
              ...(authTokens && authTokens.accessToken ? { 'Authorization': 'Bearer ' + authTokens.accessToken } : {}),
              'privy-id-token': (authTokens && authTokens.idToken) || '',
            },
            body: JSON.stringify({
              id_token: (authTokens && !authTokens.accessToken ? authTokens.idToken : '') || '',
              identity_token: (authTokens && !authTokens.accessToken ? authTokens.idToken : '') || '',
              access_token: (authTokens && authTokens.accessToken) || '',
              wallet_address: primaryWallet,
              user: candidateUser,
              mfa_verified: !!verifiedFlag,
              mfa_code: mfaCode || '',
              mfa_methods: knownMfaMethods,
              // T794: include referral code so backend can process it on new registrations.
              ref_code: (() => { try { return localStorage.getItem('veyra_ref_code') || ''; } catch (_) { return ''; } })(),
            }),
          });

          let authTokens = await readAuthTokens();
          let resp = await doServerVerify(false, authTokens);
          let data = await readJsonSafe(resp);

          if (!resp.ok && resp.status === 403 && data && data.error === 'mfa_required') {
            const serverMethods = normalizeMfaMethods(data.methods || []);
            if (serverMethods.length) {
              knownMfaMethods = serverMethods;
            }
            const mfaCode = await runLoginMfaPrompt(knownMfaMethods);
            resp = await doServerVerify(false, authTokens, mfaCode);
            data = await readJsonSafe(resp);
          }

          if (!resp.ok && resp.status === 401) {
            const errText = String((data && (data.message || data.error)) || '').toLowerCase();
            const shouldRefreshRetry = errText.includes('invalid jwt token provided') || errText.includes('missing id_token') || errText.includes('missing id_token or access_token') || errText.includes('invalid auth token');
            if (shouldRefreshRetry) {
              setMsg({ type: 'info', text: 'SYS> Refreshing Privy session and retrying login...', show: true });
              try {
                if (typeof privy.refreshUser === 'function') {
                  await privy.refreshUser();
                }
              } catch (_) { }
              authTokens = await readAuthTokens();
              resp = await doServerVerify(false, authTokens);
              data = await readJsonSafe(resp);
            }
            if ((!resp.ok || !authTokens.accessToken) && shouldRefreshRetry && !hardResetRetryRef.current) {
              hardResetRetryRef.current = true;
              setMsg({ type: 'info', text: 'SYS> Resetting stale Privy session and restarting login...', show: true });
              await resetHomepageSession();
              completedLoginRef.current = false;
              manualTriggerRef.current = true;
              await new Promise((r) => setTimeout(r, 250));
              if (typeof loginFn === 'function') {
                loginFn();
                return;
              }
            }
          }

          if (!resp.ok) {
            let errMsg = t('err_server_error') + ` (${resp.status})`;
            errMsg = (data && (data.message || data.error)) || errMsg;
            throw new Error(errMsg);
          }
          hardResetRetryRef.current = false;
          const tip = data && data.auto_provisioned
            ? (t('msg_login_ok') + ' ' + t('msg_auto_pm_ready'))
            : t('msg_login_ok');
          setMsg({ type: 'ok', text: tip, show: true });
          manualTriggerRef.current = false;
          // T794: Clear stored referral code after successful login (one-time use).
          try { localStorage.removeItem('veyra_ref_code'); } catch (_) { }
          setTimeout(() => { window.location.href = '/v2/discover'; }, FAST_REDIRECT_MS);
        } catch (err) {
          manualTriggerRef.current = false;
          setMsg({ type: 'err', text: t('msg_login_failed') + (err.message || String(err)), show: true });
          setBusy(false);
        }
      }

      useEffect(() => {
        if (!ready || !authenticated || completedLoginRef.current) return;
        if (!walletsReady) return;
        if (!primaryWallet) return;
        completedLoginRef.current = true;
        clearPopupTimer();
        if (!busy) setBusy(true);
        setMsg({ type: 'info', text: t('msg_verify_token'), show: true });
        completeLogin(user).catch(() => {

        });
      }, [ready, authenticated, user, walletsReady, primaryWallet]);

      return React.createElement(
        React.Fragment,
        null,
        React.createElement(
          'button',
          {
            className: 'btn',
            disabled: !ready || busy,
            onClick: async () => {
              setBusy(true);
              completedLoginRef.current = false;
              hardResetRetryRef.current = false;
              manualTriggerRef.current = true;

              if (authenticated && walletsReady && primaryWallet) {
                clearPopupTimer();
                setMsg({ type: 'info', text: t('msg_verify_token'), show: true });
                completeLogin(user).catch(() => {
                  completedLoginRef.current = false;
                });
                return;
              }

              if (!authenticated) {
                await clearBackendSessionBestEffort();
                clearPrivyBrowserState();
              }

              setMsg({ type: 'info', text: t('msg_launch_modal'), show: true });
              clearPopupTimer();
              popupTimerRef.current = setTimeout(function () {
                popupTimerRef.current = null;
                setBusy(false);
                setMsg({ type: 'err', text: t('msg_modal_timeout'), show: true });
              }, 12000);
              try {
                if (typeof loginFn !== 'function') {
                  throw new Error('Privy login API is unavailable in current runtime');
                }
                loginFn();
              } catch (e) {
                clearPopupTimer();
                setBusy(false);
                setMsg({ type: 'err', text: t('msg_open_modal_failed') + (e?.message || String(e)), show: true });
              }

    async function boot() {

          try {
            const keys = [];
            for (let i = 0; i < localStorage.length; i += 1) {
              const k = localStorage.key(i);
              if (k && k.toLowerCase().startsWith('privy:')) keys.push(k);
            }
            keys.forEach((k) => { try { localStorage.removeItem(k); } catch (_) { } });
          } catch (_) { }
          try {
            const sk = [];
            for (let i = 0; i < sessionStorage.length; i += 1) {
              const k = sessionStorage.key(i);
              if (k && k.toLowerCase().startsWith('privy:')) sk.push(k);

            sk.forEach((k) => { try { sessionStorage.removeItem(k); } catch (_) { } });
          } catch (_) { }

            if (window.indexedDB && typeof indexedDB.databases === 'function') {

              (dbs || []).forEach((db) => {

          try {
            ['privy-session', 'privy-token', 'privy-id-token', 'privy-refresh-token'].forEach((c) => {
              document.cookie = c + '=; Max-Age=0; path=/; SameSite=Lax';
            });
          } catch (_) { }
          try {
            u.searchParams.delete('logged_out');
            const cleanUrl = u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : '') + (u.hash || '');
            window.history.replaceState({}, '', cleanUrl);
          } catch (_) { }
        }
      } catch (_) { }

      const cfgResp = await fetch('/api/user/privy/config', { credentials: 'include' });
      const cfg = await cfgResp.json();
      if (!cfg.enabled || !cfg.app_id) {
        app.innerHTML = '<div class="msg show err">' + t('msg_privy_not_configured') + '</div>';
        return;
      }

      const root = createRoot(app);
      const mfaAction = parseMfaAction();
      const child = mfaAction
        ? React.createElement(MfaInner, { action: mfaAction })
        : React.createElement(LoginInner);

      root.render(
        React.createElement(
          PrivyProvider,
          {
            appId: cfg.app_id,
            config: {
              appUrl: appOrigin,
              embeddedWallets: {
                ethereum: {
                  createOnLogin: 'users-without-wallets',
                },

              loginMethods: ['wallet', 'email', 'google'],
              appearance: {
                theme: 'dark',
                accentColor: '#2ee68b',
                showWalletLoginFirst: true,
                walletChainType: 'ethereum-only',
                walletList: ['detected_ethereum_wallets', 'metamask', 'coinbase_wallet', 'rainbow'],
              },
              externalWallets: {
                walletConnect: {
                  enabled: false,
                },
              },
            },
          },
          child
        )
      );
    }

    boot().catch((err) => {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="msg show err">' + t('msg_bundle_load_failed') + (err.message || String(err)) + '</div>';
    });

      function pickLang() {
        try {
          var l = localStorage.getItem('veyra_lang') || localStorage.getItem('vp_lang') || (navigator.language || 'en');
          if (l && I18N[l]) return l;
          var short = (l || '').split('-')[0];
          if (short && I18N[short]) return short;
        } catch (_) { }
        return 'en';
      }
      var lang = pickLang();
      var d = I18N[lang] || I18N.en;
      function show() {
        var el = document.getElementById('vpCookieToast');
        if (!el) return;
        document.getElementById('vpCookieTitle').textContent = d.title;
        document.getElementById('vpCookieText').textContent = d.text;
        document.getElementById('vpCookieDeny').textContent = d.deny;
        document.getElementById('vpCookieOver18').textContent = d.over18;
        document.getElementById('vpCookieAccept').textContent = d.accept;
        el.style.display = 'block';
        function close(action) {
          try { localStorage.setItem(KEY, action + ':' + Date.now()); } catch (_) { }
          el.style.display = 'none';
        }
        document.getElementById('vpCookieDeny').addEventListener('click', function () {
          try { localStorage.setItem(KEY, 'deny:' + Date.now()); } catch (_) { }
          window.location.href = 'https://www.google.com/';
        });
        document.getElementById('vpCookieOver18').addEventListener('click', function () { close('over18'); });
        document.getElementById('vpCookieAccept').addEventListener('click', function () { close('accept'); });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
      else show();
    })();
  </script>
